<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Karaoke</title>
    <!-- <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script> -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: rgb(10, 10, 10);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .spotify-icon {
            font-size: 32px;
            color: #1DB954;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #1DB954;
        }

        main {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 16px;
            padding: 30px;
            backdrop-filter: blur(10px);
        }

        .tracks {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .track {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(29, 185, 84, 0.2);
            border-radius: 12px;
            padding: 15px;
            transition: all 0.3s ease;
        }

        .track:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(29, 185, 84, 0.5);
        }

        .track-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .track-info h2 {
            font-size: 18px;
            margin-bottom: 5px;
            color: #1DB954;
        }

        .track-info p {
            font-size: 14px;
            color: #b3b3b3;
        }

        .volume-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .volume-btn {
            background: rgba(29, 185, 84, 0.3);
            border: 1px solid #1DB954;
            color: #1DB954;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .volume-btn:hover {
            background: rgba(29, 185, 84, 0.5);
        }

        .volume-display {
            font-size: 12px;
            color: #b3b3b3;
            min-width: 25px;
            text-align: center;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            border: none;
            border-radius: 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-play {
            background: #1DB954;
            color: #000;
        }

        .btn-play:hover {
            background: #1ed760;
            transform: scale(1.05);
        }


        .btn-pause[data-state="off"] {
            background: #591515 !important;
            color: #ffffff;
            border: 1px solid #410000 !important;
        }

        .btn-pause:hover[data-state="off"] {
            background: rgb(214, 84, 84) !important;
            transform: scale(1.05);

        }

        .btn-pause {
            background: rgba(29, 185, 84, 0.2);
            color: #1DB954;
            border: 1px solid #1DB954;
        }

        .btn-pause:hover {
            background: rgba(29, 185, 84, 0.3);
            transform: scale(1.05);
        }

        .btn-icon {
            font-size: 18px;
        }

        @media (max-width: 480px) {
            .controls {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }

        .playlist {
            margin-top: 30px;
        }

        .playlist h2 {
            font-size: 16px;
            color: #1DB954;
            margin-bottom: 12px;
        }

        .playlist-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 300px;
            overflow-y: auto;
        }

        .playlist-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(29, 185, 84, 0.15);
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 14px;
        }

        .playlist-item .name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-right: 10px;
        }

        .playlist-status {
            font-size: 12px;
            white-space: nowrap;
        }

        .playlist-status.downloaded {
            color: #1DB954;
        }

        .playlist-status.downloading {
            color: #e0b34d;
        }

        .playlist-status.pending {
            color: #b3b3b3;
        }

        .playlist-empty {
            font-size: 13px;
            color: #b3b3b3;
        }

        .key-shift {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }

        .key-shift label {
            font-size: 14px;
            color: #b3b3b3;
        }

        .key-shift select {
            background: rgba(255, 255, 255, 0.05);
            color: #1DB954;
            border: 1px solid #1DB954;
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <div class="logo">
                <span class="spotify-icon">♪</span>
                <h1>Spotify Karaoke</h1>
            </div>
            <p id="status" style="padding-bottom: 10px;"></p>
            <h2 id="track_name"></h2>
            <p id="track_scale"></p>
            <div class="key-shift">
                <label for="key-select">Key:</label>
                <select id="key-select"></select>
            </div>
        </header>

        <main>
            <div class="tracks">
                <div class="track">
                    <div class="track-header">
                        <div class="track-info">
                            <h2>Instrumental (o/p)</h2>
                        </div>
                        <div class="volume-controls">
                            <button class="volume-btn" id="track1-minus">−</button>
                            <span class="volume-display" id="track1-vol">100%</span>
                            <button class="volume-btn" id="track1-plus">+</button>
                        </div>
                    </div>
                    <audio id="track1"></audio>
                </div>

                <div class="track">
                    <div class="track-header">
                        <div class="track-info">
                            <h2>Vocals (k/l)</h2>
                        </div>
                        <div class="volume-controls">
                            <button class="volume-btn" id="track2-minus">−</button>
                            <span class="volume-display" id="track2-vol">100%</span>
                            <button class="volume-btn" id="track2-plus">+</button>
                        </div>
                    </div>
                    <audio id="track2"></audio>
                </div>
            </div>

            <div class="controls">
                <button id="play-btn" class="btn btn-pause" data-state="off">
                    Disabled, click to enable
                </button>
            </div>

            <div class="playlist">
                <h2>Downloaded tracks</h2>
                <div class="playlist-list" id="playlist-list">
                    <p class="playlist-empty">Loading playlist...</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        const trackName = document.getElementById('track_name');
        const trackScale = document.getElementById('track_scale');
        const statusLabel = document.getElementById('status');
        const playBtn = document.getElementById('play-btn');
        const track1 = document.getElementById('track1');
        const track2 = document.getElementById('track2');
        const keySelect = document.getElementById('key-select');
        let midiDevice = null;

        const majorKeys = ['C major', 'C# major', 'D major', 'D# major', 'E major', 'F major',
            'F# major', 'G major', 'G# major', 'A major', 'A# major', 'B major'];
        const minorKeys = ['A minor', 'A# minor', 'B minor', 'C minor', 'C# minor', 'D minor', 'D# minor', 'E minor', 'F minor', 'F# minor', 'G minor', 'G# minor'];
        let currentScale = null;


        // Key shift in semitones, persisted across tracks
        let keyOptions = [];
        for (let index = 0; index < majorKeys.length; index++) {
            const opt = document.createElement('option');

            const el = majorKeys[index];
            const elMin = minorKeys[index];

            opt.value = el;
            opt.textContent = el + ' / ' + elMin;
            if (keyOptions.length === 0) {
                opt.selected = true;
            };
    
            keySelect.appendChild(opt);
            keyOptions.push(opt);   
        }

        keySelect.addEventListener('change', (e) => {
            // Re-send MIDI signal for currently loaded track with new shift
            currentScale = e.target.value;
            [2, 3].forEach(oct => sendMidiSignal(noteNumber(currentScale, oct)));
        });


        setTrack1Vol(0.5);
        setTrack2Vol(0.1);

        function validVolume(volume) {
            if (volume < 0) return 0;
            if (volume > 1) return 1;
            return volume;
        }

        function setTrack1Vol(volume) {
            track1.volume = Math.min(validVolume(volume));
            const vol = Math.round(track1.volume * 100); document.getElementById('track1-vol').textContent = vol + '%';
        }

        function setTrack2Vol(volume) {
            track2.volume = Math.min(validVolume(volume));
            const vol = Math.round(track2.volume * 100);
            document.getElementById('track2-vol').textContent = vol + '%';
        }

        let polling;
        playBtn.addEventListener('click', () => {
            if (playBtn.dataset.state === 'off') {
                polling = setInterval(poll, 2000);
                playBtn.textContent = 'Enabled';
                playBtn.dataset.state = 'on';
                document.title = 'Spotify Karaoke';

                navigator.requestMIDIAccess().then(midi => {
                    const outputs = [...midi.outputs.values()];
                    midiDevice = outputs.find(o => o.name.includes('IAC')) || outputs[0];
                    if (!midiDevice) {
                        return;
                    }

                    midiDevice.open()
                        .then(() => {
                            playBtn.textContent = 'Enabled - ' + midiDevice.name;
                        });
                });
            } else {
                clearInterval(polling);
                trackName.textContent = '';
                trackScale.textContent = '';
                statusLabel.textContent = '';
                playBtn.dataset.state = 'off';
                playBtn.textContent = 'Disabled, click to enable';

                track1.pause();
                track2.pause();
                document.title = 'Karaoke is disabled';
            }
        });

        // Volume controls for Track 1
        document.getElementById('track1-plus').addEventListener('click', () => {
            setTrack1Vol(track1.volume + 0.01, 1);
        });

        document.getElementById('track1-minus').addEventListener('click', () => {
            setTrack1Vol(track1.volume - 0.01, 0);

        });

        // Volume controls for Track 2
        document.getElementById('track2-plus').addEventListener('click', () => {
            setTrack2Vol(track2.volume + 0.01, 1);
        });

        document.getElementById('track2-minus').addEventListener('click', () => {
            setTrack2Vol(track2.volume - 0.01, 0);
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'p') {
                setTrack1Vol(track1.volume + 0.01, 1);
            }

            if (e.key === 'o') {
                setTrack1Vol(track1.volume - 0.01, 0);
            }

            if (e.key === 'l') {
                setTrack2Vol(track2.volume + 0.01, 1);
            }

            if (e.key === 'k') {
                setTrack2Vol(track2.volume - 0.01, 0);
            }
        });

        let playingTrackIsrc = null;

        async function loadTrack(state_resp, isrc) {
            statusLabel.textContent = 'Loading track...';
            document.title = 'Loading track...';
            trackName.textContent = state_resp.data.item.name;
            trackScale.textContent = '---';

            await fetch('/spotify_pause');
            const resp = await fetch('/load_song/' + isrc);
            const data = await resp.json();

            if (playingTrackIsrc !== isrc || data.status !== 'ok') {
                return;
            }

            trackName.textContent = data.name;
            trackScale.textContent = '';
            statusLabel.textContent = data.infos;
            currentScale = data.scale;

            keyOptions.forEach(el => {
                el.selected = el.value === currentScale;
            });

            const p = await fetch('/spotify_play');
            await p.json();

            track1.src = data.no_vocals;
            track1.currentTime = 0;
            track1.play();

            track2.src = data.vocals;
            track2.currentTime = 0;
            track2.play();

            if (midiDevice) {
                [2, 3].forEach(oct => {
                    const note = noteNumber(data.scale, oct);
                    sendMidiSignal(note);
                });
            }

            document.title = 'Playing track...';
        }


        function noteNumber(name, octave) {
            let keys = [];
            if (name.includes('major')) {
                keys = majorKeys;
            } else {
                keys = minorKeys;
            }

            return keys.indexOf(name) + (octave + 2) * 12; // C4 = 60
        }

        async function poll() {
            const resp = await fetch('/state');
            const data = await resp.json();

            if (data.status_label && data.status_label.length) {
                statusLabel.textContent = data.status_label;
            }

            if (!data.is_playing) {
                track1.pause();
                track2.pause();
                return;
            }

            const isrc = data.data.item.external_ids?.isrc;

            if (playingTrackIsrc === isrc) {
                const spotifyTrackPosition = data.data.progress_ms / 1000;
                const diff = Math.abs(track1.currentTime - spotifyTrackPosition);

                if (track1.paused) {
                    track1.play();
                    track2.play();
                } else {
                    if (diff > 5) {
                        track1.currentTime = 0;
                        track2.currentTime = 0;

                        const p = await fetch('/spotify_play');
                        await p.json();
                        track1.play();
                        track2.play();
                    }
                }
            } else {
                playingTrackIsrc = isrc;
                loadTrack(data, isrc);
            }

            if (!data.is_playing) {
                track1.pause();
                track2.pause();
            }
        };

        const playlistList = document.getElementById('playlist-list');

        function sendMidiSignal(note) {
            if (!midiDevice) {
                return;
            }

            console.log('Sending midi signal');
            midiDevice.send([0x90, note, 127]);
            setTimeout(() => midiDevice.send([0x80, note, 0]), 500);
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function statusLabelFor(track) {
            if (track.downloading) return { text: 'Downloading...', cls: 'downloading' };
            if (track.converting) return { text: 'Converting...', cls: 'downloading' };
            if (track.downloaded) return { text: 'Downloaded', cls: 'downloaded' };
            return { text: 'Pending', cls: 'pending' };
        }

        async function pollPlaylist() {
            const resp = await fetch('/playlist_status');
            const data = await resp.json();

            if (!data.enabled) {
                playlistList.innerHTML = '<p class="playlist-empty">No playlist configured (set KARAOKE_PLAYLIST).</p>';
                return;
            }

            if (!data.tracks.length) {
                playlistList.innerHTML = '<p class="playlist-empty">No tracks found in playlist.</p>';
                return;
            }

            playlistList.innerHTML = data.tracks.map(track => {
                const status = statusLabelFor(track);
                return `<div class="playlist-item">
                    <span class="name">${escapeHtml(track.name)}</span>
                    <span class="playlist-status ${status.cls}">${status.text}</span>
                </div>`;
            }).join('');
        }

        pollPlaylist();
        setInterval(pollPlaylist, 5000);
    </script>
</body>

</html>
